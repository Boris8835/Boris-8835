name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar estructura Android
        run: |
          flutter create --org ar.consorciofield --project-name consorcio_field --platforms=android _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold
      - name: Ajustar Android (permisos, minSdk 29, nombre)
        run: dart tools/preparar_android.dart
      - run: flutter pub get
      - name: Generar íconos
        run: dart run flutter_launcher_icons
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ConsorcioField-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK como descarga (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Consorcio Field APK ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
      - name: Guardar APK en la rama apk
        run: |
          mkdir /tmp/apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/ConsorcioField.apk
          cd /tmp/apk
          git init -q
          git checkout -q -b apk
          git add .
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -qm "APK compilado"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} apk

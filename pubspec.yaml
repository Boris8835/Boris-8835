name: consorcio_field
description: Consorcio Field - administración de consorcios en terreno, 100% offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  geolocator: ^12.0.0
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.13.1
  pdf: ^3.11.1
  share_plus: ^10.0.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B2545"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 29
